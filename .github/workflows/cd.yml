name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api,       dir: api_service }
          - { name: matcher,   dir: matcher_service }
          - { name: location,  dir: location_service }
          - { name: simulator, dir: driver_simulator }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.REPO }}/${{ matrix.name }}:${{ github.sha }}